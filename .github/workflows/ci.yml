
name: Titanic ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train Titanic model
        run: python titanic_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run ML pipeline tests
        run: python -m unittest test_titanic_model.py -v

      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: titanic-ml-artifacts
          path: |
            titanic_model.pkl
            metrics.json
            titanic_passenger_raw_600.csv
          if-no-files-found: error
          retention-days: 7

      # Practical-7: Build Docker image
      - name: Build Docker image
        run: docker build -t titanic-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name titanic-ml-container \
            -p 5000:5000 \
            titanic-ml:${{ github.sha }}

      - name: Test application health endpoint
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          docker logs titanic-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"Pclass":1,"Sex":"female","Age":25,"SibSp":0,"Parch":0,"Fare":80,"Embarked":"C","Name":"Smith, Miss. Jane"}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'
          echo "$response" | grep -q '"prediction_code"'

      - name: Show Docker container logs
        if: always()
        run: docker logs titanic-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f titanic-ml-container || true

      # Prepare release package
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp titanic_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf '%s\n' \
            'Titanic Survival Prediction Application' \
            'Start: python app.py' \
            'Health endpoint: GET /' \
            'Prediction endpoint: POST /predict' \
            'Docker build: docker build -t titanic-ml:1.0 .' \
            > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: titanic-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      # Practical-8: Publish the tested image to GHCR
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag titanic-ml:${{ github.sha }} ghcr.io/ramisetty88/titanic-ml-app:v1
          docker tag titanic-ml:${{ github.sha }} ghcr.io/ramisetty88/titanic-ml-app:latest

      - name: Push v1 image
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/ramisetty88/titanic-ml-app:v1

      - name: Push latest image
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/ramisetty88/titanic-ml-app:latest

      # Verify the published image can be pulled and run
      - name: Pull image from GHCR
        if: github.event_name != 'pull_request'
        run: docker pull ghcr.io/ramisetty88/titanic-ml-app:v1

      - name: Run container from GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker run -d \
            --name titanic-ghcr-container \
            -p 5001:5000 \
            ghcr.io/ramisetty88/titanic-ml-app:v1

      - name: Test GHCR health endpoint
        if: github.event_name != 'pull_request'
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/; then
              echo "GHCR container is healthy."
              exit 0
            fi
            echo "Waiting for GHCR container... attempt $i"
            sleep 2
          done
          docker logs titanic-ghcr-container
          exit 1

      - name: Test GHCR prediction endpoint
        if: github.event_name != 'pull_request'
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"Pclass":3,"Sex":"male","Age":22,"SibSp":1,"Parch":0,"Fare":7.25,"Embarked":"S"}' \
            http://localhost:5001/predict)

          echo "GHCR prediction response: $response"
          echo "$response" | grep -q '"prediction"'
          echo "$response" | grep -q '"prediction_code"'

      - name: Show GHCR container logs
        if: always()
        run: docker logs titanic-ghcr-container || true

      - name: Remove GHCR container
        if: always()
        run: docker rm -f titanic-ghcr-container || true
